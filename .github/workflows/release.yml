# release.yml: build the release files for a version tag and attach them to its release.
# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:45
    steps:
      - name: Install the build tools
        run: >-
          dnf -y install cargo gcc make python3 git gh zip tar glib2 glib2-devel
          pkgconf-pkg-config libxkbcommon-devel wayland-devel mesa-libEGL-devel
          dbus-devel systemd-devel

      - name: Check out
        uses: actions/checkout@v7

      - name: Check the tag against the version
        run: |
          version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || {
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version} in manifest.json" >&2
            exit 1
          }

      - name: Test
        run: make test

      - name: Build the release files
        run: make dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" build/dist/*
          --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}"
          --generate-notes --verify-tag
